<!DOCTYPE html>
<html lang="en">
<head>
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Score Tracker</title>
</head>
<body>

    <h1>Interactive Score Tracker</h1>

    <p id="val">Current Score: 0</p>
