<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Registration Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="registration-Card">
        <h1 id="welcomeMessage">Welcome!</h1>

        <input id="nameInput" type="text" placeholder="Enter your name: ">

        <form id="studentForm">
            <input id="courseInput" type="text" placeholder="Enter your course: ">
            <button type="submit">Register</button>
        </form>
        <p id="registrationOutput"></p>

        <buttom type="submit" id="themeButton">Toggle Theme</buttom>
    </div>

    <script src="script.js"></script>
</body>
</html>
